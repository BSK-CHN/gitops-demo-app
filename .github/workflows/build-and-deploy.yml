name: Build and update GitOps deployment
 
on:
  push:
    branches: [ "main" ]
 
permissions:
  contents: read
 
env:
  IMAGE_NAME: thecloudschool/gitops-demo-app
  DEPLOY_REPO: BSK-CHN/gitops-demo-deploy
 
jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application source
        uses: actions/checkout@v4
 
      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
 
      - name: Check out deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy-repo
 
      - name: Update image tag in deployment manifest
        env:
          NEW_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          manifest=deploy-repo/app/deployment.yaml
          grep -qE '^[[:space:]]*image:.*gitops-demo-app:' "$manifest" || {
            echo "Could not find a gitops-demo-app image in $manifest"
            exit 1
          }
          sed -i -E "s#(^[[:space:]]*image:[[:space:]]*).*gitops-demo-app:[^[:space:]]+#\1${IMAGE_NAME}:${NEW_TAG}#" "$manifest"
          grep -F "image: ${IMAGE_NAME}:${NEW_TAG}" "$manifest"
 
      - name: Commit and push deployment change
        working-directory: deploy-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update app image to ${{ steps.vars.outputs.tag }}"
          git push origin HEAD:main
